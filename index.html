<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Madii City Game</title>
<style>
body{margin:0;overflow:hidden;background:#87CEEB;font-family:Arial}
#ui{position:absolute;top:10px;left:10px;color:#fff;background:rgba(0,0,0,0.6);padding:10px 15px;border-radius:12px;z-index:10;font-weight:bold}
#joy{position:absolute;bottom:20px;left:20px;width:120px;height:120px;background:rgba(255,255,255,0.2);border-radius:60px;z-index:10;border:2px solid rgba(255,255,255,0.3)}
#stick{position:absolute;width:50px;height:50px;background:rgba(255,255,255,0.8);border-radius:25px;left:35px;top:35px}
#btns{position:absolute;bottom:20px;right:20px;z-index:10;display:flex;flex-direction:column;gap:12px}
.btn{width:80px;height:80px;background:rgba(0,0,0,0.6);border-radius:40px;color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;border:2px solid white}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
</head>
<body>
<div id="ui">Madii City Game<br>Speed: <span id="speed">0</span></div>
<div id="joy"><div id="stick"></div></div>
<div id="btns"><div class="btn" id="acc">RACE</div><div class="btn" id="brake">BRAKE</div></div>
<script>
let scene,camera,renderer,car,keys={},speed=0;
init();
function init(){
 scene=new THREE.Scene(); scene.background=new THREE.Color(0x87CEEB);
 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
 renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight);
 document.body.appendChild(renderer.domElement);
 let light=new THREE.DirectionalLight(0xffffff,1); light.position.set(10,20,10);scene.add(light);
 scene.add(new THREE.AmbientLight(0xffffff,0.6));
 let ground=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000), new THREE.MeshStandardMaterial({color:0x2a2a2a}));
 ground.rotation.x=-Math.PI/2;scene.add(ground);
 car=new THREE.Mesh(new THREE.BoxGeometry(2,1,4), new THREE.MeshStandardMaterial({color:0xff0000}));
 car.position.y=0.5;scene.add(car);
 for(let i=0;i<100;i++){
   let h=8+Math.random()*35;
   let b=new THREE.Mesh(new THREE.BoxGeometry(10+Math.random()*10,h,10+Math.random()*10), new THREE.MeshStandardMaterial({color:0x8888bb}));
   let x=(Math.random()-0.5)*1000, z=(Math.random()-0.5)*1000;
   if(Math.abs(x)<40 && Math.abs(z)<40) continue;
   b.position.set(x,h/2,z);scene.add(b);
 }
 camera.position.set(0,12,20);
 animate();
 window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
 setupControls();
}
function setupControls(){
 window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
 window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
 let joy=document.getElementById('joy'),stick=document.getElementById('stick'),active=false,sx=0,sy=0;
 joy.addEventListener('touchstart',e=>{active=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;});
 joy.addEventListener('touchmove',e=>{if(!active)return;let dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;let d=Math.min(40,Math.hypot(dx,dy));let a=Math.atan2(dy,dx);let nx=Math.cos(a)*d,ny=Math.sin(a)*d;stick.style.left=(35+nx)+'px';stick.style.top=(35+ny)+'px';keys['arrowleft']=nx<-10;keys['arrowright']=nx>10;keys['arrowup']=ny<-10;keys['arrowdown']=ny>10;});
 joy.addEventListener('touchend',()=>{active=false;stick.style.left='35px';stick.style.top='35px';keys['arrowleft']=keys['arrowright']=keys['arrowup']=keys['arrowdown']=false;});
 document.getElementById('acc').addEventListener('touchstart',()=>keys['w']=true);
 document.getElementById('acc').addEventListener('touchend',()=>keys['w']=false);
 document.getElementById('brake').addEventListener('touchstart',()=>keys['s']=true);
 document.getElementById('brake').addEventListener('touchend',()=>keys['s']=false);
}
function animate(){
 requestAnimationFrame(animate);
 if(keys['w']||keys['arrowup'])speed=Math.min(0.7,speed+0.025);
 else if(keys['s']||keys['arrowdown'])speed=Math.max(-0.3,speed-0.04);
 else speed*=0.97;
 if(Math.abs(speed)>0.01){
   if(keys['a']||keys['arrowleft'])car.rotation.y+=0.06;
   if(keys['d']||keys['arrowright'])car.rotation.y-=0.06;
   car.translateZ(-speed);
 }
 camera.position.lerp(new THREE.Vector3(car.position.x+Math.sin(car.rotation.y)*18,9,car.position.z+Math.cos(car.rotation.y)*18),0.08);
 camera.lookAt(car.position);
 document.getElementById('speed').innerText=Math.round(Math.abs(speed*120));
 renderer.render(scene,camera);
}
</script>
</body>
</html>
